[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-quant-agent"
version = "0.1.0"
description = "A股量化研究工具，第一阶段数据基础设施"
requires-python = ">=3.11"
dynamic = ["dependencies"]
[project.scripts]
quant-agent = "quant_agent.cli:main"
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.lock"]}
[tool.setuptools.packages.find]
include = ["quant_agent*"]
[tool.ruff]
extend-exclude = [".python", ".venv", ".venv311"]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.11"
strict = true
[[tool.mypy.overrides]]
module = ["akshare", "duckdb"]
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=quant_agent --cov-report=term-missing --cov-fail-under=80"
